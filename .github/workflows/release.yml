name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write   # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check tag matches package version
        run: |
          VERSION=$(grep -o '<Version>[^<]*' OpenBarcode.csproj | sed 's/<Version>//')
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Test
        run: dotnet test tests/OpenBarcode.Tests/OpenBarcode.Tests.csproj --configuration Release

      - name: Pack
        run: dotnet pack OpenBarcode.csproj --configuration Release --output artifacts

      # Trusted publishing: NuGet issues a short-lived key for this run, so no long-lived API key is stored.
      # NUGET_USER is a repository variable holding the NuGet.org profile name (not a secret).
      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
