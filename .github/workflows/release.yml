name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check tag matches package version
        run: |
          VERSION=$(grep -o '<Version>[^<]*' OpenBarcode.csproj | sed 's/<Version>//')
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Test
        run: dotnet test tests/OpenBarcode.Tests/OpenBarcode.Tests.csproj --configuration Release

      - name: Pack
        run: dotnet pack OpenBarcode.csproj --configuration Release --output artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
